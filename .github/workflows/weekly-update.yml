# Weekly build validation skeleton.
# Real "搜素材写 MD" (content authoring) is out of band — done by 幕僚长 routine /
# external process that commits case MD into src/content/cases/. This workflow only
# validates that the site still builds green on Monday mornings. It does NOT deploy
# (avoids requiring Cloudflare secrets on cron; deploy stays on push-to-main).
name: Weekly update (build check)

on:
  schedule:
    # Monday 09:00 China (CST/UTC+8) = 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note content authorship
        run: |
          echo "Content MD (src/content/cases/*.md) is authored by 幕僚长 routine / external."
          echo "This cron only validates npm build stays green."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (no deploy)
        run: npm run build
