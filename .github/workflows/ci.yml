# PR / branch build check. Does not deploy.
# Production deploy stays on push to main (.github/workflows/deploy.yml).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test functions
        run: npm test

      - name: Build (no deploy)
        run: npm run build

      - name: Assert robots.txt and sitemap.xml
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          robots = Path("dist/robots.txt").read_text(encoding="utf-8")
          required = [
              "content signals:",
              "search:",
              "ai-input:",
              "ai-train:",
              "ARTICLE 4 OF THE EUROPEAN UNION DIRECTIVE 2019/790",
              "User-agent: OAI-SearchBot\nAllow: /",
              "User-agent: *\nAllow: /",
              "Sitemap: https://crossagent.maoxunxing.com/sitemap.xml",
          ]
          for snippet in required:
              if snippet not in robots:
                  raise SystemExit(f"robots.txt missing: {snippet!r}")
          if "Disallow" in robots:
              raise SystemExit("robots.txt must not add Disallow")
          if "GPTBot" in robots:
              raise SystemExit("robots.txt must not add a GPTBot group")

          xml = Path("dist/sitemap.xml").read_text(encoding="utf-8")
          locs = re.findall(r"<loc>([^<]+)</loc>", xml)
          if len(locs) != len(set(locs)):
              raise SystemExit("sitemap.xml has duplicate <loc> entries")

          def has(url: str) -> bool:
              return url in locs

          origin = "https://crossagent.maoxunxing.com"
          missing = []
          if not has(f"{origin}/"):
              missing.append("/")
          for slug in (
              "sourcing",
              "listing",
              "customer-service",
              "ads",
              "ops-finance",
              "logistics",
          ):
              url = f"{origin}/categories/{slug}/"
              if not has(url):
                  missing.append(url)
          case_files = list(Path("src/content/cases").glob("*.md"))
          case_locs = [u for u in locs if "/cases/" in u]
          if len(case_locs) != len(case_files):
              missing.append(
                  f"cases count {len(case_locs)} != files {len(case_files)}"
              )
          for slug in ("about", "newsletter", "sponsor", "submit"):
              url = f"{origin}/{slug}/"
              if not has(url):
                  missing.append(url)
          for guide in (
              f"{origin}/guides/amazon-seller-mcp-cross-border/",
              f"{origin}/guides/shopify-chatgpt-cn-self-check-10/",
          ):
              if not has(guide):
                  missing.append(guide)
          case = f"{origin}/cases/shop-mcp-visibility-tools/"
          if not has(case):
              missing.append(case)
          banned = [u for u in locs if "/want/" in u or "/api/" in u or u.endswith("/rss.xml")]
          if missing or banned:
              raise SystemExit(f"sitemap check failed missing={missing} banned={banned}")
          print(f"sitemap.xml locs={len(locs)} cases={len(case_locs)}")
          PY
