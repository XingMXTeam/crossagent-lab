# Local Pages config only.
# pages_build_output_dir is intentionally omitted. Adding it makes this file
# the production Pages config on the next `wrangler pages deploy` and can
# overwrite dashboard bindings. Do not add it until TT has a real KV id.
#
# Binding the Function reads: env.VOTES
# Local: npx wrangler pages dev dist --kv VOTES
#
# Before merge, TT (do not skip — votes return 503 until this exists):
#   1. Create a KV namespace (suggested name: crossagent-lab-votes)
#   2. Pages project crossagent-lab → Settings → Bindings → Add → KV namespace
#   3. Variable name: VOTES
#   4. Attach it to Production, and to Preview if preview deployments are used
# Counts are one JSON object stored at key "counts".
name = "crossagent-lab"
compatibility_date = "2026-10-14"

# Welcome sample (Resend) — functions/api/newsletter-welcome.ts
# Pages → Settings → Variables and Secrets (Production + Preview):
#   RESEND_API_KEY = <Resend API key for maoxunxing.com>
# Optional: RESEND_FROM = CrossAgent Lab <me@maoxunxing.com>
# Optional: RESEND_SEGMENT_ID = b5d0de18-840a-4741-a6e1-40a3375dfe91
#   CrossAgent Lab segment. Set on Pages (Production + Preview) to rotate
#   without a code change. Unset uses that id as the baked default.
#
# Saved list — functions/api/send-saved-list.ts
# Same RESEND_API_KEY / RESEND_FROM / RESEND_SEGMENT_ID. No new secrets.
# Newsletter checkbox calls deliverNewsletterWelcome (welcome + segment).
#
# Activation events — functions/api/activation.ts
# Cloudflare Web Analytics cannot emit custom events. Do not add the binding
# here: this file stays local-only until pages_build_output_dir is adopted,
# and a production wrangler config would overwrite dashboard bindings (VOTES).
# Before the 2-week read is trustworthy (events 503 until this exists):
#   1. Pages project crossagent-lab → Settings → Bindings → Add → Analytics engine
#   2. Variable name: ACTIVATION
#   3. Dataset: crossagent_activation
#   4. Attach it to Production, and to Preview if preview deployments are used
#   5. Redeploy. Binding changes apply on the next deploy.
# GET /api/activation → { ok, configured } and no counts.
# Data point: index1=activation, blob1=event, blob2=slug, blob3=locale, blob4=via, double1=1.
